  <!-- Datos estructurados FAQ (Schema.org) para buscadores y agentes de IA -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "¿Qué es la técnica Pomodoro?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Es un método de gestión del tiempo que divide el estudio en bloques de 25 minutos de concentración total separados por descansos cortos de 5 minutos. Cada cuatro bloques se toma un descanso largo de 15 minutos."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuál es la mejor técnica de estudio para memorizar?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Depende del material, pero la técnica Feynman es una de las más efectivas para comprender y memorizar: te obliga a explicar el tema con palabras simples, revelando los huecos en tu conocimiento."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué es el método Cornell?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Es un sistema de apuntes que organiza la página en tres zonas: ideas principales, notas de clase y un resumen final. Es el método más usado en universidades y facilita repasar antes de los exámenes."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cómo funciona la técnica Feynman?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Consiste en explicar un concepto como si se lo contaras a un niño de 10 años. Donde te trabas o usas jerga técnica hay un hueco que debes repasar en tus apuntes."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué son los mapas mentales y cuándo usarlos?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Son diagramas visuales que conectan ideas alrededor de un tema central. Son ideales para resumir temas amplios, preparar exposiciones y repasar visualmente antes de un examen."
          }
        },
        {
          "@type": "Question",
          "name": "¿Enfocate es gratis?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí. Todas las herramientas de Enfocate son completamente gratuitas y no requieren registro."
          }
        }
      ]
    }
